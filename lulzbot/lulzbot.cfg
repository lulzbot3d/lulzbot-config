#################################################
#  If you wish to customize your machine, copy  #
#  the contents of this file, or just the       #
#  section you wish to modify, paste it to      #
#  printer.cfg, and modify it there.            #
#################################################

# Pins for reference, v1.02 board:
# Driver Step Pins - 0:PC18 1:PC16 2:PC28 3:PC1  4:PC4 5:PC9
# Driver Dir Pins  - 0:PB5  1:PD10 2:PA4  3:PA22 4:PC3 5:PD14
# Driver Enable - !PA9
# Driver CS - PD17
# Thermistor Pins - TEMP0:PC15 TEMP1:PC29 TEMP2:PC30 TEMP3:PC31
# Pullup Resistor - 2200
# Vssa Sense:PC13 | Vref Sense:PC0
# Current Sense resistor for drivers - 0.05ohm
# SPI lines:{PC25} -> SPIMosi:PC27 SPIMiso:PC26 SPISCLK:PC24
# Vin Monitor:PA20
# CAN Pins - TX0:PB2 RX0:PB3 TX1:PD12 RX1:PC12
# Heaters - Out0:PA7 Out1:PA24 Out2:PA16 Out3:PA11
# Fan outputs - Out4:PA15 Out5:PC5 Out6:PA8 Out7:PC11 Out8:PC8 Out9:PA12 | Out9 is shared with VFD_Out
# Tach Pins for Fans - Out4.Tach:PC7 Out5.Tach:PD23 Out6.Tach:PA1
# GPIO_out - IO0:PD26 IO1:PD16 IO2:PD27 IO3:PA3 IO4:PE0  IO5:PD21 IO6:PA0  IO7:PD23 IO8:PE1
# GPIO_in -  IO0:PD25 IO1:PD15 IO2:PD28 IO3:PE5 IO4:PD30 IO5:PA19 IO6:PA18 IO7:PA17 IO8:PE3
# Driver Diag - 0:PD29 1:PC17 2:PD13 3:PC2 4:PD31 5:PC10


########################################
# MISC SETTINGS
########################################

[virtual_sdcard]
path: /home/pi/printer_data/gcodes

[exclude_object]

# Enable arcs support for Orcaslicer.
[gcode_arcs]
resolution: 1

[temperature_sensor SBC]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[adc_scaled vref_scaled]
vref_pin: PC0
vssa_pin: PC13

[idle_timeout]
gcode:
  {% if (printer.pause_resume.is_paused) %}
    RESPOND MSG='Hotend Idle Timeout'
    M104 S0  # turn off extruder temperature
  {% else %}
    RESPOND MSG='Idle Timeout'
    M18  # disables all motors
    TURN_OFF_HEATERS
  {% endif %}
timeout: 10800  # 180 mins

#[force_move]
#enable_force_move: True


########################################
# KINEMATICS
########################################

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 20000
max_z_velocity: 80
max_z_accel: 1000
square_corner_velocity: 20.0 
minimum_cruise_ratio: 0.2

#####################################################################
#   X/Y Stepper Settings
#####################################################################

[stepper_x]
#driver 0
step_pin: PC18
dir_pin: !PB5
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: tmc5160_stepper_x:virtual_endstop
homing_speed = 100
homing_retract_dist = 0
position_endstop: 298
position_max: 298
position_min: 0

[tmc5160 stepper_x]
cs_pin: PD17
spi_bus: usart1
chain_position: 1
chain_length: 6
interpolate: False
run_current: 1.5
sense_resistor: 0.05
diag0_pin: ^!PD29 
driver_SGT: 1 #Max sensitivity -64

[stepper_y]
#driver 1
step_pin: PC16
dir_pin: !PD10
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: tmc5160_stepper_y:virtual_endstop
homing_speed = 80
homing_retract_dist = 0
position_endstop: 295
position_max: 295
position_min: -15

[tmc5160 stepper_y]
cs_pin: PD17
chain_position: 2
chain_length: 6
interpolate: False
run_current: 1.5
sense_resistor: 0.05
diag0_pin: ^!PC17 
driver_SGT: 1 # -64 is most sensitive value, 63 is least sensitive

#####################################################################
#   Z Stepper Settings
#####################################################################

##  Z0 Stepper - Back Left
##  Connected to MOTOR_2
[stepper_z]
#driver2
step_pin: PC28
dir_pin: PA4
enable_pin: !PA9
microsteps: 16
rotation_distance: 8 
endstop_pin: probe:z_virtual_endstop 
position_min: -20
position_max: 221
homing_speed: 150
homing_retract_dist: 0
homing_retract_speed: 100
second_homing_speed: 50

[tmc5160 stepper_z]
cs_pin: PD17
chain_position: 3
chain_length: 6
interpolate: False
run_current: 1.0
sense_resistor: 0.05

##  Z1 Stepper - Front Left
##  Connected to MOTOR_3
[stepper_z1]
#driver3
step_pin: PC1
dir_pin: PA22
enable_pin: !PA9
microsteps: 16
rotation_distance: 8 #40

[tmc5160 stepper_z1]
cs_pin: PD17
chain_position: 4
chain_length: 6
interpolate: False
run_current: 1.0
sense_resistor: 0.05

##  Z2 Stepper - Middle Right
##  Connected to MOTOR_4
[stepper_z2]
#driver4
step_pin: PC4
dir_pin: !PC3
enable_pin: !PA9
microsteps: 16
rotation_distance: 8 #40

[tmc5160 stepper_z2]
cs_pin: PD17
chain_position: 5
chain_length: 6
interpolate: False
run_current: 1.0
sense_resistor: 0.05

#####################################################################
#   Toolhead
#####################################################################

[multi_pin big_boi_hotend]
pins: PA24,PA16

[extruder]
#driver5
step_pin: PC9
dir_pin: !PD14
enable_pin: !PA9
microsteps: 32
nozzle_diameter: 0.600
filament_diameter: 1.750
rotation_distance: 7.8336
heater_pin: multi_pin:big_boi_hotend
sensor_type: PT1000
pullup_resistor: 2130  #Should be 2200 by 6HC spec, but 2130 gets 300 C to show as 300 C on Fluke 87.
sensor_pin: vref_scaled:PC15 #Temp1
#control: pid
#pid_Kp: 30.089
#pid_Ki: 2.229
#pid_Kd: 101.550
min_temp: -20
max_temp: 500
max_extrude_cross_section: 5
max_extrude_only_distance: 201
pressure_advance: 0.022
pressure_advance_smooth_time: 0.03

[tmc5160 extruder]
cs_pin: PD17
chain_position: 6
chain_length: 6
interpolate: False
run_current: 0.5
sense_resistor: 0.05

[heater_fan heatbreak_fan]
#pin: PC8 #Out8
heater: extruder
heater_temp: 50.0

[heater_fan heatbreak_fan]
pin: !PA15 #Out4
cycle_time: 0.00004    #25 kHz PWM signal
#hardware_pwm: False
kick_start_time: 0
off_below: 0.06
tachometer_pin: PC7 #tachpin Out4
tachometer_ppr: 2
fan_speed: 0.35 
shutdown_speed: 0


#####################################################################
#   Probe
#####################################################################

[beacon]
x_offset: 00 # update with offset from nozzle on your machine
y_offset: 31 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
home_xy_position: 150.0, 150.0
home_z_hop: 2
home_z_hop_speed: 200
home_xy_move_speed: 2000
home_gcode_post_x: _HOME_POST_AXIS_X
home_gcode_post_y: _HOME_POST_AXIS_Y

[gcode_macro _HOME_POST_AXIS_X]
gcode:
  SAVE_GCODE_STATE NAME=hpax
  BED_MESH_CLEAR                # Hate to have these here, but it seems that if you have an active bed mesh
  SET_GCODE_OFFSET X=0 Y=0 Z=0  # or gcode offset, you get a must home axis error on the move below.
  G91  # relative mode for backoff
  {% set xb = printer["gcode_macro VARIABLES"].x_homing_backoff %}
  G1 X{xb} F4000
  G4 P1000 # Make sure bump sense has time to reset.
  RESTORE_GCODE_STATE NAME=hpax

[gcode_macro _HOME_POST_AXIS_Y]
gcode:
  SAVE_GCODE_STATE NAME=hpay
  BED_MESH_CLEAR                # Hate to have these here, but it seems that if you have an active bed mesh
  SET_GCODE_OFFSET X=0 Y=0 Z=0  # or gcode offset, you get a must home axis error on the move below.
  G91  # relative mode for backoff
  {% set yb = printer["gcode_macro VARIABLES"].y_homing_backoff %}
  G1 Y{yb} F4000
  G4 P1000 # Make sure bump sense has time to reset.
  RESTORE_GCODE_STATE NAME=hpay


#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PC11 #Out7
sensor_type: Generic 3950
sensor_pin: vref_scaled:PC30 #Temp0
control: pid
pullup_resistor: 2200
pid_Kp: 61.049
pid_Ki: 2.339
pid_Kd: 398.344
min_temp: 0
max_temp: 120

#####################################################################
#   Fans
#####################################################################

[fan] #Part Cooling Fan
pin: !PC5 #Out5
cycle_time: 0.00004   #25 kHz PWM signal
#hardware_pwm: False
kick_start_time: 0
off_below: 0.06
tachometer_pin: PD23 #tachpin Out5
tachometer_ppr: 2
max_power: 1.0
shutdown_speed: 0

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[z_tilt]
##  Use Z_TILT_ADJUST to level the bed.
##  z_positions: Location of toolhead
z_positions:
   11, 287
   11, -12
   287, 144
points:      # Subtract the nozzle to probe offset
   11, 256
   11, -12   # except this one can't reach on Y
   287, 113

speed: 500
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.015

[bed_mesh]
speed: 400
horizontal_move_z: 10
mesh_min: 10, 41
mesh_max: 278, 275
algorithm: bicubic
probe_count: 40, 40


#####################################################################
#   Accelerometer
#####################################################################

[resonance_tester]
accel_chip: beacon
probe_points: 150, 150, 20
