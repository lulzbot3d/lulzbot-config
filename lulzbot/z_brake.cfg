[output_pin z_brake]
pin: PD12
value: 0
shutdown_value: 0

[delayed_gcode my_delayed_gcode]
gcode:
    SET_PIN PIN=z_brake VALUE=1
    G4 P100
    SET_STEPPER_ENABLE stepper=stepper_z enable=1
    SET_STEPPER_ENABLE stepper=stepper_z1 enable=1
    SET_STEPPER_ENABLE stepper=stepper_z2 enable=1
initial_duration: 0.01

[idle_timeout]
timeout: 300
gcode: 
    {% if printer.extruder.target > 0 %}
        M117 Hotend Idle Timeout
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    {% endif %}
    SET_STEPPER_ENABLE stepper=extruder enable=0

[gcode_macro SAVE_CONFIG]
rename_existing: _SAVE_CONFIG
gcode:
    SET_PIN PIN=z_brake VALUE=0   # Engage Z Brake while saving config
    _SAVE_CONFIG

[gcode_macro FIRMWARE_RESTART]
rename_existing: _FIRMWARE_RESTART
gcode:
    SET_PIN PIN=z_brake VALUE=0   # Engage Z Brake while restarting firmware
    _FIRMWARE_RESTART

[gcode_macro RESTART]
rename_existing: _RESTART
gcode:
    SET_PIN PIN=z_brake VALUE=0   # Engage Z Brake while restarting
    _RESTART
