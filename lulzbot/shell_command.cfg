
[gcode_shell_command flash_mainboard]
command: bash /home/pi/lulzbot-config/lulzbot-firmware/flash_duet_6hc.sh
timeout: 180
verbose: True

[gcode_macro FLASH_MAINBOARD]
gcode:
    RUN_SHELL_COMMAND CMD=flash_mainboard
    RESPOND TYPE=command MSG='Restarting.'
    RESTART


[gcode_shell_command eth_mode_direct]
command: sudo /home/pi/lulzbot-config/lulzbot-scripts/eth_mode.sh direct
timeout: 180
verbose: True

[gcode_macro ETHERNET_MODE_DIRECT]
gcode:
    RESPOND TYPE=command MSG="action:ks_show console"
    RUN_SHELL_COMMAND CMD=eth_mode_direct

[gcode_shell_command eth_mode_normal]
command: sudo /home/pi/lulzbot-config/lulzbot-scripts/eth_mode.sh normal
timeout: 180
verbose: True

[gcode_macro ETHERNET_MODE_NORMAL]
gcode:
    RESPOND TYPE=command MSG="action:ks_show console"
    RUN_SHELL_COMMAND CMD=eth_mode_normal

[gcode_shell_command eth_mode_show]
command: sudo /home/pi/lulzbot-config/lulzbot-scripts/eth_mode.sh show
timeout: 10
verbose: True

[gcode_macro ETHERNET_MODE_SHOW]
gcode:
    RUN_SHELL_COMMAND CMD=eth_mode_show